<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Open</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#191919;color:#ddd;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  #fallback{display:none;text-align:center;font-size:13px;line-height:1.5;padding:18px}
  a{color:inherit}
</style>
</head>
<body>
<div id="fallback">
  The app did not open.<br>
  <a id="web" href="#">Open the web version</a>
</div>
<script>
(function(){
  const apps = {
    spotify: {
      web: "https://open.spotify.com/",
      windows: "spotify:",
      ios: "spotify:",
      autoWebFallback: false
    },
    teams: {
      web: "https://teams.microsoft.com/",
      windows: "msteams:",
      ios: "msteams:",
      autoWebFallback: true
    },
    chatgpt: {
      web: "https://chatgpt.com/",
      windows: "chatgpt:",
      ios: "chatgpt:",
      autoWebFallback: true
    },
    claude: {
      web: "https://claude.ai/",
      windows: "claude://claude.ai/new",
      iosShortcut: true,
      autoWebFallback: true
    },
    gemini: {
      web: "https://gemini.google.com/",
      iosShortcut: true,
      autoWebFallback: true
    },
    gmail: {
      web: "https://mail.google.com/",
      iosShortcut: true,
      autoWebFallback: true
    },
    drive: {
      web: "https://drive.google.com/",
      iosShortcut: true,
      autoWebFallback: true
    }
  };

  function platform(){
    const ua = navigator.userAgent || "";
    if (/iPhone|iPad|iPod/i.test(ua) ||
        (/Macintosh/i.test(ua) && /Mobile/i.test(ua)) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) return "ios";
    if (/Windows/i.test(ua)) return "windows";
    return "other";
  }

  function shortcutUrl(target){
    return "shortcuts://run-shortcut?name=Smart%20Open&input=text&text=" +
      encodeURIComponent(target);
  }

  function leaveLauncher(){
    try { window.close(); } catch(e) {}
    setTimeout(function(){
      if (!window.closed && history.length > 1) {
        history.back();
      }
    }, 80);
  }

  const key = new URLSearchParams(location.search).get("app");
  const cfg = apps[key];

  if (!cfg) {
    document.getElementById("fallback").style.display = "block";
    document.getElementById("fallback").firstChild.textContent = "Unknown app";
    return;
  }

  const p = platform();
  let target;
  let nativeLaunchDetected = false;
  let attemptingNative = false;

  if (p === "ios") {
    if (cfg.ios) {
      target = cfg.ios;
      attemptingNative = true;
    } else if (cfg.iosShortcut) {
      target = shortcutUrl(cfg.web);
      attemptingNative = true;
    } else {
      target = cfg.web;
    }
  } else if (p === "windows") {
    target = cfg.windows || cfg.web;
    attemptingNative = !!cfg.windows;
  } else {
    target = cfg.web;
  }

  document.getElementById("web").href = cfg.web;

  // Shared native-app hand-off behavior:
  // once the app/Shortcut takes focus, close this launcher when possible;
  // otherwise return to the page that opened it.
  if (attemptingNative) {
    document.addEventListener("visibilitychange", function(){
      if (document.hidden) {
        nativeLaunchDetected = true;
      } else if (nativeLaunchDetected) {
        leaveLauncher();
      }
    });

    window.addEventListener("pagehide", function(){
      nativeLaunchDetected = true;
    });

    window.addEventListener("focus", function(){
      if (nativeLaunchDetected) leaveLauncher();
    });
  }

  location.replace(target);

  // For apps where a web fallback is wanted, fall back only if the page
  // remains visible, which usually means no native handler took over.
  if (cfg.autoWebFallback && attemptingNative) {
    setTimeout(function(){
      if (!nativeLaunchDetected && document.visibilityState === "visible") {
        location.replace(cfg.web);
      }
    }, 3000);
  } else if (attemptingNative) {
    setTimeout(function(){
      if (!nativeLaunchDetected && document.visibilityState === "visible") {
        document.getElementById("fallback").style.display = "block";
      }
    }, 1800);
  }
})();
</script>
</body>
</html>
